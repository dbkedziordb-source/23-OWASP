services:
  dvwa:
    image: vulnerables/web-dvwa
    platform: linux/amd64
    container_name: lab23-dvwa
    ports:
      - "127.0.0.1:8080:80"

  juice-shop:
    image: bkimminich/juice-shop
    container_name: lab23-juice-shop
    ports:
      - "127.0.0.1:3000:3000"

  webgoat:
    image: webgoat/webgoat
    container_name: lab23-webgoat
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/WebGoat/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    environment:
      - TZ=Europe/Warsaw
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:9091:9090"

# docker compose up -d 
